name: CI

on:
  push:
  pull_request:

jobs:
  test-build-migrate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: modiseh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d modiseh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/modiseh
      GEMINI_API_KEY: ci-placeholder
      LLM_METADATA_FALLBACK_ENABLED: "true"
      LLM_CONFIDENCE_THRESHOLD: "0.7"
      LLM_RERANK_ENABLED: "false"
      PRODUCT_NAME_MATCHING_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest

      - name: Validate Alembic migrations
        run: |
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head

      - name: Build Docker image
        run: docker build -t modiseh-api:ci .
