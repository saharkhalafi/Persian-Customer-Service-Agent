name: modiseh-ai

# Compose Postgres credentials are isolated from host .env DATABASE_URL /
# POSTGRES_USER (often the local "postgres" superuser). Changing these after
# the volume exists requires: docker compose down -v && docker compose up -d

x-compose-db-url: &compose-db-url postgresql+psycopg://${COMPOSE_POSTGRES_USER:-modiseh}:${COMPOSE_POSTGRES_PASSWORD:-changeme}@postgres:5432/${COMPOSE_POSTGRES_DB:-modiseh}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${COMPOSE_POSTGRES_USER:-modiseh}
      POSTGRES_PASSWORD: ${COMPOSE_POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${COMPOSE_POSTGRES_DB:-modiseh}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - app_net

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: modiseh-api:local
    restart: "no"
    environment:
      ENVIRONMENT: production
      DATABASE_URL: *compose-db-url
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: modiseh-api:local
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DATABASE_URL: *compose-db-url
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AGENT_MODEL: ${AGENT_MODEL:-gemini-2.5-flash}
      AGENT_THINKING_BUDGET: ${AGENT_THINKING_BUDGET:-0}
      GEMINI_TIMEOUT_MS: ${GEMINI_TIMEOUT_MS:-45000}
      GEMINI_RETRY_ATTEMPTS: ${GEMINI_RETRY_ATTEMPTS:-2}
      LLM_METADATA_FALLBACK_ENABLED: ${LLM_METADATA_FALLBACK_ENABLED:-true}
      LLM_CONFIDENCE_THRESHOLD: ${LLM_CONFIDENCE_THRESHOLD:-0.7}
      LLM_RERANK_ENABLED: ${LLM_RERANK_ENABLED:-false}
      LLM_QUERY_UNDERSTANDING_ENABLED: ${LLM_QUERY_UNDERSTANDING_ENABLED:-false}
      PRODUCT_NAME_MATCHING_ENABLED: ${PRODUCT_NAME_MATCHING_ENABLED:-false}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-20}
      CHAT_RATE_LIMIT_REQUESTS: ${CHAT_RATE_LIMIT_REQUESTS:-20}
      CHAT_RATE_LIMIT_WINDOW_SECONDS: ${CHAT_RATE_LIMIT_WINDOW_SECONDS:-60}
      CHAT_MAX_BODY_BYTES: ${CHAT_MAX_BODY_BYTES:-16384}
      CONVERSATION_HISTORY_LIMIT: ${CONVERSATION_HISTORY_LIMIT:-8}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8000}
      DB_CONNECT_TIMEOUT_SECONDS: ${DB_CONNECT_TIMEOUT_SECONDS:-5}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-30000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PORT: 8000
      UVICORN_WORKERS: ${UVICORN_WORKERS:-1}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ${CHROMA_HOST_PATH:-./local_chroma_db-2026}:/app/local_chroma_db-2026
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks:
      - app_net

volumes:
  postgres_data:

networks:
  app_net:
    driver: bridge
